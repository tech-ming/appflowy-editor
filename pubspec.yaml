name: "appflowy_editor"

version: 6.1.0

homepage: "https://github.com/AppFlowy-IO/appflowy-editor"

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"  # 降低以支持 OpenHarmony Flutter 3.27.5

description: A highly customizable rich-text editor for Flutter. The AppFlowy
  Editor project for AppFlowy and beyond.

dependencies:
  collection: "^1.18.0"
  device_info_plus: ^11.1.0  # 降级以支持 Dart 3.6.x
  diff_match_patch: "^0.4.1"
  file_picker: ^10.2.0
  flutter:
    sdk: flutter
  flutter_svg: "^2.0.6"
  html: ^0.15.5
  http: "^1.2.0"
  intl: "^0.19.0"  # 降级以匹配 flutter_localizations
  keyboard_height_plugin: 
    git: 
      url: https://gitcode.com/tech-ming/keyboard_height_plugin.git
      ref: br_v0.2.0_ohos
  logging: "^1.2.0"
  markdown: "^7.2.1"
  nanoid: "^1.0.0"
  numerus: "^2.1.2"
  pdf: "^3.10.7"
  provider: "^6.0.5"
  scroll_to_index: "^3.0.1"
  string_validator: "^1.0.0"
  universal_html: "^2.2.4"
  universal_platform:
    git:
      url: https://gitcode.com/tech-ming/flutter-universal-platform.git
      ref: br_v1.1.0_ohos
  url_launcher:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/url_launcher/url_launcher
      ref: br_url_launcher-v6.3.0_ohos

dev_dependencies:
  # awesome_lints:  # 临时注释以解决网络问题
  #   git:
  #     url: https://github.com/LucasXu0/awesome_lints.git
  #     ref: main
  custom_lint: ^0.7.0  # 降级以支持 Dart 3.6.x
  flutter_lints: ^5.0.0  # 降级以支持 Dart 3.6.x
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  intl_utils: "^2.8.2"
  mockito: "^5.4.1"
  network_image_mock: "^2.1.1"
  path_provider: "^2.0.5"
  pubspec_dependency_sorter: "^1.0.5"


platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:
  ohos:

topics:
  - widgets
  - editor
  - appflowy

flutter:
  assets:
    - "assets/images/toolbar/"
    - "assets/images/selection_menu/"
    - "assets/images/image_toolbar/"
    - "assets/images/"
    - "assets/mobile/toolbar_icons/"

flutter_intl:
  enabled: true
  class_name: AppFlowyEditorLocalizations
  main_locale: en
  arb_dir: lib/l10n
  output_dir: lib/src/l10n
  use_deferred_loading: false
  localizely:
    project_id: b7199c7d-eca0-4025-894d-230cdcafa9aa
